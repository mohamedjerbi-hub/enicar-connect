version: '3.8'

# ═══════════════════════════════════════════════════════════════════════
# ENICAR Connect — Testing Infrastructure
# Start all QA tools: docker-compose -f docker-compose.qa.yml up -d
# ═══════════════════════════════════════════════════════════════════════

services:

  # ── SonarQube — Static Code Analysis & Quality Gate ─────────────────
  sonarqube:
    image: sonarqube:10.5-community
    container_name: enicar-sonarqube
    ports:
      - "9000:9000"
    environment:
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/system/status"]
      interval: 30s
      timeout: 10s
      retries: 10
    networks:
      - qa-network

  # ── Kiwi TCMS — Test Case Management System ──────────────────────────
  kiwi-db:
    image: postgres:15-alpine
    container_name: enicar-kiwi-db
    environment:
      POSTGRES_DB: kiwitcms
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: kiwi_secure_2024
    volumes:
      - kiwi_db_data:/var/lib/postgresql/data
    networks:
      - qa-network

  kiwi:
    image: kiwitcms/kiwi:latest
    container_name: enicar-kiwi-tcms
    ports:
      - "8080:80"
    environment:
      KIWI_DB_ENGINE: django.db.backends.postgresql
      KIWI_DB_HOST: kiwi-db
      KIWI_DB_PORT: 5432
      KIWI_DB_NAME: kiwitcms
      KIWI_DB_USER: kiwi
      KIWI_DB_PASSWORD: kiwi_secure_2024
    depends_on:
      - kiwi-db
    networks:
      - qa-network

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  kiwi_db_data:

networks:
  qa-network:
    driver: bridge
