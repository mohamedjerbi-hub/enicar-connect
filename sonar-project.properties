sonar.projectKey=tn.enicar:enicar-connect
sonar.projectName=ENICAR Connect
sonar.projectVersion=1.0.0
sonar.sourceEncoding=UTF-8

# Java binaries & sources
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes

# JaCoCo coverage - run: ./mvnw clean verify first
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Surefire test results (JUnit XML)
sonar.junit.reportPaths=target/surefire-reports

# Exclusions - frontend, generated entities, application bootstrap
sonar.exclusions=src/main/frontend/**,**/model/**,**/*Application.java
sonar.coverage.exclusions=**/dto/**,**/config/**,**/model/**,**/*Application.java

# SonarQube server (authenticate with SONAR_TOKEN in the environment)
sonar.host.url=http://localhost:9000
