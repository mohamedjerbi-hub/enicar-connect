# ===== Server =====
server.port=8081

# ===== Database — H2 (default dev profile, no Docker required) =====
spring.datasource.url=jdbc:h2:file:./database
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Flyway disabled for H2 profile — Hibernate manages schema in dev
spring.flyway.enabled=false

# ===== Logs =====
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Sécurité (JWT) =====
app.jwt.secret=enicar-connect-secret-key-2026-very-long-secure-random-string-minimum-256-bits
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origins=http://localhost:4200
