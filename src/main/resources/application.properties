# ===== Server =====
server.port=8081

# Profil par défaut : PostgreSQL + Flyway (aligné Docker Compose)
spring.profiles.active=postgres

# ===== Database — PostgreSQL =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/enicar_db}
spring.datasource.username=${DB_USERNAME:enicar}
spring.datasource.password=${DB_PASSWORD:enicar2026}
spring.datasource.driver-class-name=org.postgresql.Driver

# Flyway gère le schéma — Hibernate valide uniquement
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ===== Flyway =====
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== Logs =====
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ===== Sécurité (JWT) =====
app.jwt.secret=${JWT_SECRET:enicar-connect-secret-key-2026-very-long-secure-random-string-minimum-256-bits}
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
