version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: enicar_db
    environment:
      POSTGRES_USER: enicar
      POSTGRES_PASSWORD: enicar2026
      POSTGRES_DB: enicar_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enicar -d enicar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - enicar_net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: enicar_app
    environment:
      - SPRING_PROFILES_ACTIVE=postgres
      - DB_URL=jdbc:postgresql://db:5432/enicar_db
      - DB_USERNAME=enicar
      - DB_PASSWORD=enicar2026
      - CORS_ORIGINS=http://localhost:8081
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - enicar_net

volumes:
  pgdata:

networks:
  enicar_net:
    driver: bridge
